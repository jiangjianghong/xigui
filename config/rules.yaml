# 规则活配置
#
# 字段说明:
#   id                     规则唯一标识(上游传入的 rule_id)
#   name                   规则名称(仅用于日志/文档)
#   description            规则描述(仅用于日志/文档)
#   require_field_name     bool。是否要求请求里 field_a.name / field_b.name 必填。
#                          - true:  缺 name 直接返 422
#                          - false: 不校验
#                          (建议每条规则都显式写出来,不依赖默认值)
#   system_prompt          LLM 的系统提示。建议每条规则按自身领域显式声明;
#                          留空(空字符串)则不向模型发送 system 消息。
#   prompt_template        Prompt 模板。所有规则的判定标准都由这里描述。
#                          支持占位符(与请求体里的字段键一一对应):
#                            {field_a} {field_b} ...          字段值
#                            {field_a_name} {field_b_name}    字段名
#                          注意:JSON 示例里的大括号要写成双重 {{ }},否则 .format 会报错。
#                          注意:match 必须让模型输出 true|false,不能输出中文。
#
# 设计原则:本服务所有规则都走 LLM,不再有"确定性 vs 语义"之分。所有边界条件
# (容差、容忍空白、单位换算、日期格式等)都在 prompt_template 里用自然语言描述。
#
# 修改本文件后:
#   - 自动: 下一次请求时基于 mtime 自动 reload
#   - 手动: curl -X POST http://localhost:6549/admin/reload-rules

rules:
  # --- R001: 项目代码一致性 ---
  - id: cross_rule_01
    name: 总投资金额一致
    description: 判断两个总投资金额是否数值相等(允许单位差异)
    require_field_name: false
    system_prompt: 你是熟悉政府投资项目财务管理的注册会计师,擅长金额单位换算(亿/万/元)与一致性核对,输出严格遵守约定格式。
    prompt_template: |
      请判断以下两个"总投资金额"是否数值相等。

      允许差异:单位写法(如"1.2亿" == "12000万元" == "120000000元")、千分位逗号、
      空白、人民币符号(¥/RMB)。
      不允许差异:数值有任何实际差异(即使 0.01 元)。如无法可靠换算到统一单位,
      判为不一致。

      A: {field_a}
      B: {field_b}

      在理由中要说明两项差额的百分比

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由,需说明换算后的金额>"}}
  - id: cross_rule_02
    name: 项目名称是否一致
    description: 容忍简称/全称/前后缀差异;把字段名注入 prompt,让 LLM 知道在判什么
    require_field_name: false
    system_prompt: 你是熟悉企业项目名称识别的合规审核员,能区分项目名称的差异与一致性，输出严格遵守约定格式。
    prompt_template: |
      请判断审核备与申报表的两个的项目名称是否一致。

      允许差异:简称与全称、有/无行政区划前缀、"有限公司"与"有限责任公司"互换、
      集团/分公司层级差异(如"XX集团" 与 "XX集团北京分公司"视为不同主体)。
      不允许差异:名称中关键字明显不同(如"中铁"与"中建")。

      审核备 ：{field_a}
      申报表 ：{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<说明具体不符合的原因>"}}
  - id: cross_rule_03
    name: 建设内容详情基本
    description: 语义基本
    require_field_name: false
    system_prompt: 你是熟悉工程项目建设内容描述的合规审核员,擅长把两段自然语言列表对齐后比较子项目增减与规格差异,输出严格遵守约定格式。
    prompt_template: |
      请判断以下两段文本描述的"建设内容"，在所列项目类别上是否基本一致。

      【比对对象】
      - 审核备案："{field_a}"
      - 申报表："{field_b}"

      【判断规则】
      1. 允许的差异：
         - 除建设内容本身之外的其他描述性差异（如无该描述也可）；
         - 子项目（如不同管径、不同材质）的具体划分可以不同，只要将各子项目的数量按统一单位累加后，与另一份文件中对应大类的总量基本一致即可
           （例如：d100管2km + d1000管3km，累加为5km，与"道路排水管网约5km"视为一致）。
      2. 不允许的差异：
         - 建设内容涉及的类别、范围或总体规模存在较大出入（判断时只看汇总后的总量及类别是否一致，不需要比较子项目是否逐一对应）。

      【计算要求】
      - 涉及数量比较时，先统一单位（如米/公里、平方米/平方公里等），再进行累加；
      - 若涉及加总计算，需将具体的加法算式写入理由中。

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过150字的中文理由,需点明差异项(如有)，需要指出计算过程>"}}
  - id: cross_rule_04
    name: 所属投向领域是否一致
    description: 项目申报表的所属投向领域（三级）和可研的主要建设内容的方向是否一致
    require_field_name: false
    system_prompt: |-
      你是一个所属投向领域判断专家，和一致性校验专家
      我会给你一个关于建设内容的描述 以及所属投向领域的内容  你需要判断建设内容是否符合所属投向领域 一般方向包括供水方向、排水方向、燃气方向
    prompt_template: |-
      所属投向领域：{field_a}
      建设内容描述：{field_b}

      1.供水方向：如识别出改造供（给）水管网（线、道）、阀门、排气阀、排泥阀、检查井、加压泵站、二次供水、庭院管网、水表、分区计量设备（装置）、流量计、压力计、泵站（泵房）、监测设施等关键词
      2.排水方向，如包含雨污混接点改造、雨水管道（网）、排水管道（网）、易涝点改造、调蓄池、箱涵、雨水泵站、移动泵车、**渠、**沟整治等建设内容。
      3.燃气方向，如建设内容主要为燃气立管、庭院管道、市政燃气管道、燃气场站、“瓶改管”以及燃气检测、预警、物联网感知设备（如智能燃气表、燃气报警器、智能安全阀等）等

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_05
    name: 项目代码是否一致
    description: 项目代码是否一致
    require_field_name: false
    system_prompt: 你是一个对比校验专家
    prompt_template: |-
      你需要判断我给你提供的审核备和申报表的项目代码是否一致 ，空格符号等微小差异可忽略

      审核备:{field_a}
      申报表:{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_06
    name: 项目单位是否一致
    description: 项目申报表的项目单位 和可研的项目单位是否一致
    require_field_name: false
    system_prompt: 你是一个文本一致性对比专家
    prompt_template: |-
      你需要判断我给你提供的审核备和申报表项目单位是否基本一致，可以有描述差异，只要基本一致就行
      审核备:{field_a}
      申报表:{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_07
    name: 属于超长期特别国债支持范围的投资的一致性
    description: 项目申报表中“项目总投资中属于超长期特别国债支持范围的投资”与剔除情况说明中的符合超长期特别国债支持范围投资是否一致
    require_field_name: false
    system_prompt: 你是一个金额对比专家
    prompt_template: |-
      请判断项目申报表中“项目总投资中属于超长期特别国债支持范围的投资”是否小于等于剔除情况说明中的投资，如果是返回true,否则返回false

      项目申报表：{field_a}
      剔除情况说明：{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_08
    name: 建设内容是否含有明确的规模数量
    description: 项目申报表和初步设计（或可行性研究报告）建设内容是否含有明确的规模数量且明确是改造或新建
    require_field_name: false
    system_prompt: 你是一个描述校验专家
    prompt_template: |-
      请判断审核备和申报表建设内容应含有明确的规模数量（比如DN500管网***公里等）且明确是改造或新建

      当审核备和申报表两项都明确时返回true，否则返回false

      审核备:{field_a}
      申报表:{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_09
    name: 地方财政资金一致性
    description: 项目申报表中地方财政资金和资金承诺函附件的地方财政资金是否一致
    require_field_name: false
    system_prompt: 你是一个资金对比校验专家
    prompt_template: |-
      请判断 项目申报表中地方财政资金和资金承诺函附件的地方财政资金是否一致，如果一致返回true,不一致或者一个为空返回false

      资金承诺函附件的地方财政资金：{field_a}
      项目申报表中地方财政资金：{field_b}

      在理由中要说明两项差额的百分比

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_10
    name: 自有资金一致性
    description: 项目申报表中自有资金和资金承诺函附件的自有资金是否一致
    require_field_name: false
    system_prompt: 你是一个数据校验专家
    prompt_template: |-
      请判断 项目申报表中自有资金和资金承诺函附件的自有资金是否一致，如果一致返回true,不一致或者一个为空返回false

      资金承诺函附件的自有资金：{field_a}
      项目申报表中自有资金：{field_b}

      在理由中要说明两项差额的百分比

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_11
    name: 银行贷款一致性
    description: 项目申报表中银行贷款和资金承诺函附件的银行贷款是否一致
    require_field_name: false
    system_prompt: 你是一个数据校验专家
    prompt_template: |-
      请判断 项目申报表中自有资金和资金承诺函附件的银行贷款是否一致，如果一致返回true,不一致或者一个为空返回false

      资金承诺函附件的银行贷款：{field_a}
      项目申报表中银行贷款：{field_b}

      在理由中要说明两项差额的百分比

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_12
    name: 比对审核备和实施方案的建设内容和规模两者内容是否一致
    description: 比对审核备和实施方案的建设内容和规模两者内容是否一致
    require_field_name: false
    system_prompt: 你是一个内容校验对比专家
    prompt_template: |-
      任务：比较“审核备的建设内容”与“实施方案的建设内容”是否基本一致（允许描述性差异，但核心工程量、主要指标、建设范围须指向同一实体）。

      判定规则（满足以下任一即视为基本一致）：
      1. 标准化处理后（去除空格、标点、常见冗余词如“建设”、“工程”、“相关”、“配套”、“拟”等），核心主体相同；
      2. 规模数字允许单位差异（如“5万吨”与“50000吨”）、约数差异（如“约10公里”与“10公里”）；
      3. 描述详略不同，但关键设施、功能、地点一致。

      处理步骤：
      - 从两端文本中提取核心工程内容（主要建筑物、处理能力、面积、长度、容量等关键指标）。
      - 比较时忽略：标点（中英文、全半角）、空格、量词表述、冗余词、阶段词（“新建/扩建”）、前后顺序。
      - 若提取的核心要素（如处理厂规模、道路长度、建筑面积等）数值差在±5%以内，或仅因“约/大概”等修饰导致差异，视为一致。

      用户的输入内容为：
      输入信息：
      - 审核备中的内容为：{field_a}
      - 实施方案中的内容为：{field_b}


      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<说明具体不符合的原因>"}}
  - id: cross_rule_13
    name: 比对审核备和实施方案的总投资两者内容是否一致
    description: 比对审核备和实施方案的总投资两者内容是否一致
    require_field_name: false
    system_prompt: 你是一个对比校验专家
    prompt_template: |+
      任务：比较“审核备的总投资”与“实施方案的总投资”是否一致。判定标准：差异绝对值小于10%（即 |A-B|/max(A,B) < 10% 或 |A-B|/min(A,B) <10%，通常用相对差异，但为统一，可用 |A-B| / ((A+B)/2) <10% 亦可，但为简化，可比较差值占较大值的比例）。

      处理步骤：
      1. 从文本中提取数字和单位（如“万元”、“亿元”、“元”、“万”、“亿”等）。
      2. 统一换算为同一单位（建议统一为“万元”或“元”），注意：1亿元=10000万元，1万元=10000元。
      3. 比较换算后的数值A和B。
      4. 计算差异百分比：diff = |A-B| / max(A,B) * 100%。若 diff < 10%，则判定为一致（match: true）；否则不一致（match: false）。

      注意：如果文本中有约数表述（如“约”、“大概”等），仍按数字计算，但可视为允许误差，不过我们按数值比较即可。

      在理由中要说明两项差额的百分比

      以下是用户的输入内容：
      - 审核备总投资的信息：{field_a}
      - 实施方案总投资的信息：{field_b}


      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}

  - id: cross_rule_14
    name: 比对申报表中所属投向三级领域和审核备中建设内容和规模的方向是否一致
    description: 比对申报表中所属投向三级领域和审核备中建设内容和规模的方向是否一致
    require_field_name: false
    system_prompt: 你是一个对比校验专家
    prompt_template: |-
      比对申报表中所属投向三级领域和审核备中建设内容和规模的方向是否一致（基本一致就行）

      所属投向三级领域：{field_a}
      审核备：{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_15
    name: 判断项目申报表中总投资与审核备的总投资是否一致。
    description: 判断项目申报表中总投资与审核备的总投资是否一致。
    require_field_name: false
    system_prompt: 你是一个分析对比专家
    prompt_template: |-
      比对申报表中总投资和审核备中总投资是否一致（差异小于10%都满足一致）
      请注意单位换算，理由和结果一致

      申报表的总投资：{field_a}
      审核备的总投资：{field_b}

      在理由中要说明两项差额的百分比

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_16
    name: 比对项目申报表中总投资与最深度批复文件的总投资是否一致。
    description: 比对项目申报表中总投资与最深度批复文件的总投资是否一致。
    require_field_name: false
    system_prompt: 你是一个对比校验专家
    prompt_template: |-
      判断比对项目申报表中总投资与最深度批复文件的总投资是否一致。 差异小于10% 就为一致 最深度批复有两项，需要两项都满足才为true 理由需要和结果相对应
      申报表：{field_a}
      最深度批复：{field_b}

      在理由中要说明两项差额的百分比

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_17
    name: 比对项目申报表信息，与审核备文件中的关键信息：项目名称
    description: 比对项目申报表信息，与审核备文件中的关键信息：项目名称
    require_field_name: false
    system_prompt: 你是一个对比分析校验专家
    prompt_template: |-
      比对申报表中项目名称和审核备中项目名称是否一致（可以细微差距，基本一致就行）
      申报表的项目名称：{field_a}
      审核备的项目名称：{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_18
    name: 比对项目申报表信息，与审核备文件中的关键信息：项目建设内容和规模
    description: 比对项目申报表信息，与审核备文件中的关键信息：项目建设内容和规模
    require_field_name: false
    system_prompt: 你是一个对比校验分析专家
    prompt_template: |-
      比对申报表中建设内容和规模和审核备中建设内容和规模是否一致（可以有描述差距）
      申报表的建设内容和规模：{field_a}
      审核备的建设内容和规模：{field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
