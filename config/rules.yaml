      2. 页码：必须完全一致（去除首尾空格后比较，允许“P10”与“p10”大小写差异，但数字必须相同）。
      3. 综合判定：当且仅当项目名称基本一致 **且** 页码完全一致时，输出 match: true；否则 match: false。

