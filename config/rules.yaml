      1.将建设内容中剔除需要被剔除的内容（如有）
      2.对剔除后的内容判断其是否有信息化平台建设(不希望有)，判断标准：（如分量信息标准），信息化大屏、道路工程、电力网等等
      如果有返回false 否则返回true

      需要剔除的内容:{field_a}
      建设内容:{field_b}


      严格按 JSON 输出,不要任何额外说明:
