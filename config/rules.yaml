  - id: zhongxue_cross_neirong
    name: 建设内容交叉验证
    description: 建设内容交叉验证
    require_field_name: false
    system_prompt: 你是一个建设内容对比校验专家 你需要判断以下建设内容是否基本一致 可以有描述差距 但是需要基本一致
    prompt_template: |-
      任务：判断“可行性研究批复的建设内容”与“初步设计批复的建设内容”是否基本一致。
      允许的差异（视为一致）：
      - 标点符号（中英文、全半角）、空格、换行
      - 量词或单位表述（如“平方米”与“㎡”）
      - 常见冗余词（“建设”、“工程”、“相关”、“配套”等）
      - 数字格式（“1000”与“1,000”）
      - 项目阶段描述（“拟建”、“新建”等）

      输入：
      - 可行性研究批复内容：{field_a}
      - 初步设计批复内容：{field_b}

      处理步骤：
      1. 标准化：去除首尾空格，统一标点为英文半角，删除常见冗余词列表中的词汇。
      2. 比较标准化后的文本是否包含相同的主体内容（核心工程量、主要设施、规模指标等）。
      3. 若核心要素一致，仅存在上述允许差异，则判定为基本一致。


      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}
  - id: cross_rule_23
