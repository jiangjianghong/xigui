[project]
name = "ai-cross-check"
version = "0.1.0"
description = "AI交叉校验 - 投资项目文件合规审核规则比对引擎"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.2",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "filelock>=3.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "respx",
]

[tool.mypy]
# PyYAML 无内建类型标注。不为它引入 types-PyYAML dev 依赖(离线构建更省事),
# 直接告诉 mypy 别对缺 stub 的 yaml 报 import-untyped。
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
