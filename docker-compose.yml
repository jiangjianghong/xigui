services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai_cross_check:latest
    container_name: ai_cross_check_app
    restart: always
    environment:
      PYTHONUNBUFFERED: "1"
      CONFIG_PATH: "/app/config/config.yaml"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
      - ./ui:/app/ui
    ports:
      - "6549:6549"
