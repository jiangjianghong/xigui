# 规则配置(tests 专用 fixture)
#
# 字段说明:
#   id                     规则唯一标识(上游传入的 rule_id)
#   name                   规则名称(仅用于日志/文档)
#   description            规则描述(仅用于日志/文档)
#   require_field_name     bool。是否要求请求里每个 field.name 都必填。
#                          - true:  缺 name 直接返 422
#                          - false: 不校验
#                          (建议每条规则都显式写出来,不依赖默认值)
#   system_prompt          LLM 的系统提示。建议每条规则按自身领域显式声明;
#                          留空(空字符串)则不向模型发送 system 消息。
#   field_defs             可选。自定义字段 ID 列表,决定本规则请求体里的字段键。
#                          不写/为空则用默认的 field_a / field_b / ...
#   prompt_template        Prompt 模板。所有规则的判定标准都由这里描述。
#                          占位符与请求里的字段键一一对应:
#                            {field_a} {field_b} ...          字段值(默认键)
#                            {field_a_name} {field_b_name}    字段名
#                          配了 field_defs 时改用自定义 ID,如 {danwei_shenbao}
#                          注意:JSON 示例里的大括号要写成双重 {{ }},否则 .format 会报错。
#
# 注意:本文件是 tests/ 专用 fixture(固定为 R001-R005 共 5 条),
# 与业务活配置 config/rules.yaml 解耦——业务侧改活配置不应影响测试。
# 修改本文件前请先确认 tests/integration/ 下相关断言。

rules:
  # --- R001: 项目代码一致性 ---
  - id: "R001"
    name: "项目代码完全一致"
    description: "判断两个项目代码是否指向同一项目"
    require_field_name: false
    system_prompt: "你是熟悉政府投资项目文件比对的合规审核员,专注于字段字面与语义一致性判定,输出严格遵守约定格式。"
    prompt_template: |
      请判断以下两个"项目代码"字符串是否指向同一项目。

      允许差异:首尾空白、大小写差异、全角/半角符号差异。
      不允许差异:任何字符、数字、连字符位置的差异。

      A: {field_a}
      B: {field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}

  # --- R002: 总投资金额一致性 ---
  - id: "R002"
    name: "总投资金额一致"
    description: "判断两个总投资金额是否数值相等(允许单位差异)"
    require_field_name: false
    system_prompt: "你是熟悉政府投资项目财务管理的注册会计师,擅长金额单位换算(亿/万/元)与一致性核对,输出严格遵守约定格式。"
    prompt_template: |
      请判断以下两个"总投资金额"是否数值相等。

      允许差异:单位写法(如"1.2亿" == "12000万元" == "120000000元")、千分位逗号、
      空白、人民币符号(¥/RMB)。
      不允许差异:数值有任何实际差异(即使 0.01 元)。如无法可靠换算到统一单位,
      判为不一致。

      A: {field_a}
      B: {field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由,需说明换算后的金额>"}}

  # --- R003: 批复时间早于申报时间 ---
  - id: "R003"
    name: "批复时间早于申报时间"
    description: "判断 field_a 的日期是否严格早于 field_b"
    require_field_name: false
    system_prompt: "你是熟悉政府项目审批流程的合规审核员,擅长解析各类中文日期写法并比较先后,输出严格遵守约定格式。"
    prompt_template: |
      请判断 A 的日期是否严格早于 B 的日期(A < B)。

      常见的日期格式:"2024年1月10日"、"2024-01-10"、"2024/01/10"、"二零二四年一月十日" 等。
      若两个日期相等,或 A 晚于 B,或任一日期无法解析,均判为不一致。

      A (批复时间): {field_a}
      B (申报时间): {field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由,需说明解析后的两个日期>"}}

  # --- R004: 建设单位名称基本一致 ---
  # 本规则是「自定义字段 ID」的测试载体:field_defs 声明了两个 slug,
  # 请求体必须用 danwei_shenbao / danwei_pifu 作键,传 field_a 会返 422。
  # prompt_template 同时引用 {danwei_shenbao_name},因此 require_field_name=true。
  - id: "R004"
    name: "建设单位名称基本一致"
    description: "容忍简称/全称/前后缀差异;把字段名注入 prompt,让 LLM 知道在判什么"
    field_defs: ["danwei_shenbao", "danwei_pifu"]
    require_field_name: true
    system_prompt: "你是熟悉企业法人主体识别的合规审核员,能区分简称、全称、行政区划前缀、母公司与分支机构,输出严格遵守约定格式。"
    prompt_template: |
      请判断字段"{danwei_shenbao_name}"与字段"{danwei_pifu_name}"的两个值是否指向同一个法人主体。

      允许差异:简称与全称、有/无行政区划前缀、"有限公司"与"有限责任公司"互换、
      集团/分公司层级差异(如"XX集团" 与 "XX集团北京分公司"视为不同主体)。
      不允许差异:名称中关键字明显不同(如"中铁"与"中建")。

      A ({danwei_shenbao_name}): {danwei_shenbao}
      B ({danwei_pifu_name}): {danwei_pifu}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过30字的中文理由>"}}

  # --- R005: 建设内容详情完全一致 ---
  - id: "R005"
    name: "建设内容详情完全一致"
    description: "语义严格一致,允许排序/标点/格式差异,但内容项不能增减"
    require_field_name: false
    system_prompt: "你是熟悉工程项目建设内容描述的合规审核员,擅长把两段自然语言列表对齐后比较子项目增减与规格差异,输出严格遵守约定格式。"
    prompt_template: |
      请判断以下两段"建设内容"是否在所列项目上严格一致。

      允许差异:项目顺序、标点符号、空白、序号格式、措辞微调(如"建设道路 5 公里"
      与"道路建设:5km")。
      不允许差异:任一段多出或缺少任何子项目,或子项目的数量/规格/面积有差异。

      A: {field_a}
      B: {field_b}

      严格按 JSON 输出,不要任何额外说明:
      {{"match": true|false, "reason": "<不超过50字的中文理由,需点明差异项(如有)>"}}
